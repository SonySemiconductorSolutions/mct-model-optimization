name: Run Network Deployment Tests

on:
  workflow_call:
    inputs:
      converter-version:
        required: true
        type: string
      tpc-version:
        required: true
        type: string

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Remove MCT code
        run: |
          rm -rf model_compression_toolkit
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "torch<2.7" "torchvision<0.22" "onnx<1.18" "onnxruntime<1.22" "onnxruntime-extensions<0.14"
          pip install pytest pytest-mock
          pip check
      - name: Run pytest
        env:
          TPC_VERSION: ${{inputs.tpc-version}}
        run: |
          python -c 'import model_compression_toolkit; print("MCT version:", model_compression_toolkit.__version__)'
          pytest tests_network_deployment/test_run_mct.py