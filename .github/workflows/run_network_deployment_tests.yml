name: Run Network Deployment Tests

on:
  workflow_call:
    inputs:
      converter-version:
        required: true
        type: string
      tpc-version:
        required: true
        type: string
      converter-mctq-version:
        required: true
        type: string

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "torch<2.7" "torchvision<0.22" "onnx<1.18" "onnxruntime<1.22" "onnxruntime-extensions<0.14"
          pip install pytest pytest-mock
          pip list | grep mct
      - name: Run MCT test
        env:
          TPC_VERSION: ${{ inputs.tpc-version }}
        run: |
          pytest network_deployment_tests/test_run_mct.py
      - name: Setup converter environment
        run: |
          pip uninstall -y mct-quantizers
          pip install mct-quantizers==${{ inputs.converter-mctq-version }}
          pip install imx500-converter[pt]==${{ inputs.converter-version }}
          pip list | grep -e mct -e imx500
      - name: Run Converter test
        run: |
          pytest network_deployment_tests/test_run_converter.py