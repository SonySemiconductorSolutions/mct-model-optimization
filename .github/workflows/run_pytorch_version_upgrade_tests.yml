name: Test PyTorch Version Upgrade

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-pytorch-version:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        torch-version: ["2.6.*", "2.7.*", "2.8.*", "2.9.*", "2.10.*", "2.11.*", "2.12.*", "2.13.*", "2.14.*"]
        np_ver: ["<2.4", "2.4"]
        exclude:
          - python-version: "3.10"
            np_ver: "2.4"
    env:
      TORCH_VERSION: ${{ matrix.torch-version }}
      NUMPY_VERSION: ${{ matrix.np_ver }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        id: install_dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "torch==$TORCH_VERSION" torchvision onnx onnxruntime "onnxruntime-extensions<0.14"
          if [ "$NUMPY_VERSION" = "2.4" ]; then
            pip install "numpy==2.4.*"
          else
            pip install "numpy<2.4"
          fi
          pip install pytest pytest-mock
      - name: Record environment
        if: always()
        run: |
          echo "Source SHA: $GITHUB_SHA"
          echo "Requested PyTorch: $TORCH_VERSION"
          echo "Requested NumPy: $NUMPY_VERSION"
          python --version
          python -m pip list
      - name: Check dependencies
        id: check_dependencies
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' }}
        run: python -m pip check
      - name: Run pytest
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' && steps.check_dependencies.outcome == 'success' }}
        run: pytest tests_pytest/pytorch_tests -s
      - name: Run unittests
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' && steps.check_dependencies.outcome == 'success' }}
        run: python -m unittest discover tests/pytorch_tests -v
      - name: Run ONNX export tests
        if: ${{ !cancelled() && steps.install_dependencies.outcome == 'success' && steps.check_dependencies.outcome == 'success' }}
        run: python -m unittest tests.pytorch_tests.exporter_tests.test_runner.PytorchExporterTestsRunner -v